<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-muted: #8b949e;
      --text-subtle: #484f58;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-orange: #d29922;
      --btn-primary-bg: #238636;
      --btn-primary-hover: #2ea043;
      --btn-danger-bg: #da3633;
      --btn-danger-hover: #f85149;
      --btn-secondary-bg: #21262d;
      --btn-secondary-hover: #30363d;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }
    body {
      min-width: 300px;
      max-width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 0;
    }
    .wizard-container { padding: 16px; }
    .wizard-header { text-align: center; margin-bottom: 8px; }
    .wizard-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: -0.3px;
    }
    .wizard-header h2 span {
      color: var(--text-muted);
      font-weight: 400;
    }
    .step-indicator {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .progress-bar-container {
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: 2px;
      margin: 10px 0 16px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-green), #2ea043);
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }
    .step-panel {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    .step-panel.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-panel h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .step-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary {
      background: var(--btn-primary-bg);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--btn-primary-hover); }
    .btn-danger {
      background: var(--btn-danger-bg);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: var(--btn-danger-hover); }
    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--btn-secondary-hover); }
    .status-msg {
      font-size: 11px;
      margin-top: 6px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      display: none;
      line-height: 1.4;
    }
    .status-msg.success { display: block; background: #0d2b1e; color: var(--accent-green); border-left: 3px solid var(--accent-green); }
    .status-msg.error { display: block; background: #2b0d14; color: var(--accent-red); border-left: 3px solid var(--accent-red); }
    .status-msg.info { display: block; background: #0d1b2b; color: var(--accent-blue); border-left: 3px solid var(--accent-blue); }
    .audit-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
      line-height: 1.8;
    }
    .audit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
    }
    .audit-row + .audit-row {
      border-top: 1px solid var(--bg-tertiary);
      margin-top: 2px;
      padding-top: 6px;
    }
    .audit-label { color: var(--text-muted); }
    .audit-value {
      color: var(--text-primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .confirm-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-sm);
      transition: background 0.15s;
    }
    .confirm-checkbox:hover { background: var(--bg-secondary); }
    .confirm-checkbox input { margin-top: 2px; accent-color: var(--accent-green); }
    .loader-box { text-align: center; padding: 24px 0; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--bg-tertiary);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-text {
      font-size: 14px;
      color: var(--accent-green);
      font-weight: 600;
      text-align: center;
      padding: 12px 0;
    }
    .result-text.error { color: var(--accent-red); }
    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--bg-tertiary);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer .btn-secondary {
      display: inline-block;
      width: auto;
      padding: 5px 12px;
      font-size: 11px;
      margin-bottom: 0;
    }
    .footer-text {
      font-size: 10px;
      color: var(--text-subtle);
    }
    .footer-text a {
      color: var(--text-subtle);
      text-decoration: none;
    }
    .footer-text a:hover { color: var(--text-muted); text-decoration: underline; }
    .billing-display {
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .billing-display.exhausted { color: var(--accent-orange); }
    .userId-display {
      font-size: 9px;
      color: var(--text-subtle);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="wizard-container">
    <header class="wizard-header">
      <h2>TabSync <span>Wizard</span></h2>
      <div class="step-indicator">Step <span id="currentStepNum">1</span> of 4</div>
    </header>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="step-panel active" id="step1">
      <h3>1. Backup Required</h3>
      <p class="step-desc">Save your current session before cleanup. You can restore it later.</p>
      <button id="btnDownloadBackup" class="btn btn-primary">Download Backup JSON</button>
      <div id="backupStatus" class="status-msg"></div>
    </div>

    <div class="step-panel" id="step2">
      <h3>2. Confirm</h3>
      <p class="step-desc">Review what will be erased:</p>
      <div class="audit-box" id="auditBox">
        <div class="audit-row"><span class="audit-label">Loading...</span></div>
      </div>
      <label class="confirm-checkbox">
        <input type="checkbox" id="chkConfirm">
        <span>I confirm. Destroy all tabs and groups.</span>
      </label>
      <button id="btnExecute" class="btn btn-danger" disabled>Execute Deep Clean</button>
    </div>

    <div class="step-panel" id="step3">
      <h3>3. Cleaning...</h3>
      <div class="loader-box">
        <div class="spinner"></div>
        <span id="cleanProgressText" class="step-desc" style="margin-bottom:0">Destroying all groups and tabs...</span>
      </div>
    </div>

    <div class="step-panel" id="step4">
      <h3>4. Done</h3>
      <div class="result-text" id="resultText"></div>
      <button id="btnClose" class="btn btn-primary">Close</button>
    </div>

    <div class="footer">
      <div class="footer-row">
        <input type="file" id="fileRestore" accept=".json" style="display:none">
        <button id="btnRestore" class="btn btn-secondary">Restore from Backup JSON</button>
        <button id="btnBuyCredits" class="btn btn-secondary" style="display:none">Buy Credits</button>
      </div>
      <div id="billingDisplay" class="billing-display"></div>
      <div id="userIdDisplay" class="userId-display"></div>
      <div class="footer-text"><a href="#" id="linkEula">EULA</a></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
