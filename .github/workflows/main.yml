name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: self-hosted
    defaults:
      run:
        shell: C:\Program Files\Git\usr\bin\bash.exe {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0
        continue-on-error: true